aid: zeen
name: Zeen
description: 'Zeen is an AI-powered autonomous personal finance platform — a money copilot
  that connects to your financial accounts and uses background AI agents to manage money
  on your behalf. Its features include an interactive AI financial copilot that answers
  questions in real time, Guard (loss prevention that avoids overdraft fees and cancels
  unused subscriptions), Grow (yield optimization that moves idle balances to higher-interest
  accounts), and Guide (spending insights). As of mid-2026 Zeen is in pre-launch with a
  public waitlist. Zeen is backed by Cowboy Ventures and is tracked in the API Evangelist
  network as a company profile.'
